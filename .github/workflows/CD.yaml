name: Pipeline CD & DAST

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:

  deploy-staging:
    name: 0. Deploy to Staging
    runs-on: ubuntu-latest

    environment:
      name: staging

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6

      - name: Validate deployment
        run: |
          echo "Validando artefatos e configuração de Staging..."

      - name: Deploy Staging Application
        run: |
          echo "Simulando deploy da aplicação no ambiente de Staging..."
          echo "Em ambiente real:"
          echo "terraform apply / helm upgrade staging"


  dast-scan:
    name: 1. DAST - OWASP ZAP
    runs-on: ubuntu-latest
    needs: deploy-staging

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'https://staging.exemplo.com'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'


  deploy-production:
    name: 2. Deploy to Production
    runs-on: ubuntu-latest
    needs: dast-scan

    environment:
      name: production

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6

      - name: Production Deployment
        run: |
          echo "DAST e Quality Gates aprovados!"
          echo "Executando deploy em Produção..."
          echo "Em ambiente real:"
          echo "terraform apply / helm upgrade production"

      - name: Enable Monitoring
        run: |
          echo "Ativando monitoramento com Prometheus/Grafana..."