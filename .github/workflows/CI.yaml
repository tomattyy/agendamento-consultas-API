name: CI Pipeline

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - feature/*

jobs:

  build:
    name: 0. Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Configurar o Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências
        run: npm install

      - name: Compilar o código
        run: npm run build

  test:
    name: 1. Lint and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install

      - name: Execute Lint (ESLint)
        run: npm run lint
      
      - name: TypeScript Check
        run: npm run typecheck
      
      - name: Run tests 
        run: npm test --if-present

  docker: 
    name: 2. Container Security - Trivy
    runs-on: ubuntu-latest
    needs: 
      - test

    steps:
      - name: Code Checkout
        uses: actions/checkout@v6
      
      - name: Build Docker image
        run: docker build - t patient-api:${{ github.sha }} .

  trivy:
    name: 3. Container Security - Trivy
    runs-on: ubuntu-latest
    needs: 
      - docker

    steps:
      - name: Code checkout
        uses: actions/checkout@v6

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: patient-api:${{ github.sha }}
          format: 'table'
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'