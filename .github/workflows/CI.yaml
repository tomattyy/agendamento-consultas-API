name: CI Pipeline

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - feature/*

permissions:
  contents: read

jobs:

  test:
    name: Build, Lint and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      
      - name: Install dependencies
        run: npm ci
      
      - name: TypeScript Check
        run: npm run typecheck

      - name: Lint
        run: npm run lint
      
      - name: Run tests 
        run: npm run test:ci

      - name: Build
        run: npm run build

  docker: 
    name: Container Security - Trivy
    runs-on: ubuntu-latest
    needs: 
      - test

    steps:
      - name: Code Checkout
        uses: actions/checkout@v6
      
      - name: Build image
        run: |
          docker build \
          - t patient-api:${{ github.sha }} \
          .

  trivy:
    name: Container Security - Trivy
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build image
        run: |
          docker build \
            -t patient-api:${{ github.sha }} \
            .

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: patient-api:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true