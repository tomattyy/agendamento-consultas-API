name: Security Pipeline

on:
  pull_request:
  push:
    branches:
      - main
      - chore/*
      - feature/*

jobs:

  gitleaks:
    name: 0. Secret Scan - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
  semgrep:
    name: 1. SAST - Semgrep
    runs-on: ubuntu-latest
    needs: gitleaks

    permissions:
      contents: read

    steps:
      - name: Code Checkout
        uses: actions/checkout@v6

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/javascript

  npm-audit:
    name: 2. Dependency Security Check
    runs-on: ubuntu-latest
    needs: gitleaks

    steps:
      - name: Code Checkout
        uses: actions/checkout@v6

      - name: Setup Node.Js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high
        

  checkov:
    name: 3. IaC Security - Checkov
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          quiet: true
          soft_fail: false